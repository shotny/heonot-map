name: 의류수거함 데이터 자동 갱신

on:
  schedule:
    # 매주 월요일 00:00 UTC = 09:00 KST
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # GitHub Actions 탭에서 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # bins.json 커밋을 위해 필요

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 갱신
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/fetch_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bins.json
          # 변경이 있을 때만 커밋
          if ! git diff --staged --quiet; then
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "데이터 자동 갱신: $TODAY"
            git push
          else
            echo "변경 없음 - 커밋 생략"
          fi
