<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>내 주변 헌옷수거함 찾기 | 가까운 의류수거함 위치 안내</title>
<meta name="description" content="내 위치에서 가장 가까운 헌옷수거함(의류수거함)을 지도에서 바로 확인하세요. 거리순 정렬, 길찾기, 지역 검색 기능을 무료로 제공합니다." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="헌옷수거함" />

<!-- Open Graph (카카오톡·SNS 공유 미리보기) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="내 주변 헌옷수거함 찾기" />
<meta property="og:description" content="가장 가까운 의류수거함 위치를 지도에서 바로 확인하세요." />
<meta property="og:image" content="icon.svg" />

<!-- Leaflet (기본 지도, API 키 불필요) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<link rel="stylesheet" href="css/style.css" />

<!-- Google AdSense: 승인 후 config.js의 ADSENSE_CLIENT를 채운 뒤 아래 주석을 해제하세요.
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
-->
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="logo">👕</span>
    <div>
      <h1>내 주변 헌옷수거함</h1>
      <p class="tagline">가장 가까운 의류수거함을 지도와 목록으로 바로 확인하세요</p>
    </div>
  </div>
  <nav class="site-nav">
    <a href="about.html">이용안내</a>
    <a href="privacy.html">개인정보처리방침</a>
  </nav>
</header>

<!-- 상단 광고 슬롯 (애드센스 승인 전에는 비어 있는 것이 정상입니다) -->
<div class="ad-slot ad-slot-top" aria-label="광고 영역">
  <!-- <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script> -->
</div>

<main class="layout">
  <section class="panel">
    <div class="controls">
      <input id="search-input" type="text" placeholder="지역(구/동)이나 이름으로 검색... 예: 강남구, 역삼동" />
      <button id="locate-btn" type="button">📍 내 위치로 다시 찾기</button>
    </div>
    <p id="status-message" class="status">위치 정보를 준비하는 중입니다...</p>
    <div class="list-meta">
      <span id="result-count"></span>
      <span id="data-updated"></span>
    </div>
    <ul id="bin-list" class="bin-list"></ul>

    <!-- 목록 하단 인라인 광고 슬롯 -->
    <div class="ad-slot ad-slot-inline" aria-label="광고 영역"></div>

    <p class="report-line">
      우리 동네 수거함이 안 보이거나 위치가 틀렸나요?
      <a id="report-link" href="#" target="_blank" rel="noopener">위치 제보하기</a>
    </p>
  </section>

  <section class="map-wrap">
    <div id="map"></div>
  </section>
</main>

<footer class="site-footer">
  <p>본 사이트는 공공데이터를 활용한 비영리 정보 제공 목적의 서비스이며, 실제 수거함 위치·운영 여부는 관할 지자체 사정에 따라 변경될 수 있습니다.</p>
  <p><a href="about.html">이용안내 및 데이터 출처</a> · <a href="privacy.html">개인정보처리방침</a></p>
</footer>

<script src="js/config.js"></script>

<script src="js/app.js"></script>
